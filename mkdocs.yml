# Theme settings
theme:
  name: material
  custom_dir: overrides
  logo: assets/images/favicon.svg
  favicon: assets/images/favicon.svg
  palette:
    primary: indigo
    accent: teal

extra_css:
  - assets/styles/print.css
  - assets/styles/extra.css

markdown_extensions:
  - admonition

# Plugins (optional)
plugins:
  - search
