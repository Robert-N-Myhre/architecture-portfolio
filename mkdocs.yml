site_name: "Robert N. Myhre | Independent Technology Research"
site_url: "https://robert-n-myhre.github.io/architecture-portfolio/"
site_author: "Robert N. Myhre"
site_description: "Independent investigations into AI infrastructure, distributed systems, networking, security, automation, and emerging technology."

nav:
  - Home: index.md
  - Investigations:
      - Experimental & Prototype Research:
          - Project Boundary: projects/project-boundary.md
          - GPU Communication Boundaries: projects/gpu-communication-boundaries.md
          - MoE Routing Observability: projects/moe-routing-observability.md
          - MCP Platform Case Study: projects/mcp-platform-case-study.md
          - Prompt Security Guardrails: projects/prompt-guardrail-single-gpu.md
      - Architectural Research:
          - Intelligence Placement Under Constraint: projects/intelligence-placement-under-constraint.md
      - Conceptual Investigations:
          - Monitor → Classify → Escalate: reference-architectures/monitor-classify-escalate.md
          - Plan → Approve → Execute → Verify: reference-architectures/plan-approve-execute-verify.md
  - Research-Derived Architectures:
      - Governed Agentic Infrastructure Operations: reference-architectures/governed-agentic-infrastructure-operations.md
  - Research Methodology: research-methodology.md
  - About: about.md

theme:
  name: material
  custom_dir: overrides
  logo: assets/images/favicon.svg
  favicon: assets/images/favicon.svg
  palette:
    primary: indigo
    accent: teal

extra_css:
  - assets/styles/print.css
  - assets/styles/extra.css

extra_javascript:
  - https://unpkg.com/mermaid@10.9.1/dist/mermaid.min.js

markdown_extensions:
  - admonition
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search
