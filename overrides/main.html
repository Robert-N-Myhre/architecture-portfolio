{% extends "base.html" %}

{% block extrahead %}
  {{ super() }}
  <meta name="author" content="{{ config.site_author }}">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{ config.site_name }}">
  <meta property="og:title" content="{% if page and page.title %}{{ page.title }} | {{ config.site_name }}{% else %}{{ config.site_name }}{% endif %}">
  {% set page_description = page.meta.description if page and page.meta and page.meta.description else config.site_description %}
  <meta property="og:description" content="{{ page_description | e }}">
  {% if page and page.canonical_url %}
  <meta property="og:url" content="{{ page.canonical_url }}">
  {% endif %}
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="{% if page and page.title %}{{ page.title }} | {{ config.site_name }}{% else %}{{ config.site_name }}{% endif %}">
  <meta name="twitter:description" content="{{ page_description | e }}">
{% endblock %}
