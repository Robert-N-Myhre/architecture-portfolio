<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
 <title id="title">Project Bridging proposed three-plane architecture</title>
 <desc id="desc">A human to human connection goal is supported by the Human Connection Plane; the Relational Assurance Plane observes and challenges risks; the Governance and Data Plane sets consent and privacy limits.</desc>
 <rect width="960" height="430" fill="#ffffff"/>
 <text x="480" y="30" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" fill="#203048" text-anchor="middle">Human-to-human connection is the outcome</text>
 <rect x="35" y="52" width="185" height="54" rx="13" fill="#e4edf8" stroke="#678cad" stroke-width="2"/>
 <rect x="740" y="52" width="185" height="54" rx="13" fill="#e4edf8" stroke="#678cad" stroke-width="2"/>
 <text x="127" y="75" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="15" font-weight="bold" fill="#203048">Person A</text>
 <text x="127" y="93" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="11" fill="#203048">consent + authorship</text>
 <text x="832" y="75" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="15" font-weight="bold" fill="#203048">Person B</text>
 <text x="832" y="93" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="11" fill="#203048">consent + authorship</text>
 <path d="M229 78 H730" stroke="#2c806f" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 5"/>
 <path d="M229 78 l12 -7 v14 z" fill="#2c806f"/><path d="M730 78 l-12 -7 v14 z" fill="#2c806f"/>
 <text x="480" y="70" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="11" font-weight="bold" fill="#2c806f">voluntary reciprocal interaction</text>
 <path d="M480 106 V130" stroke="#697c91" stroke-width="2" stroke-dasharray="4 4"/>
 <rect x="35" y="133" width="890" height="82" rx="12" fill="#edf3fa" stroke="#5d83ad" stroke-width="2"/>
 <text x="52" y="155" font-family="DejaVu Sans, Arial" font-size="16" font-weight="bold" fill="#1d446d">1. Human Connection Plane</text>
 <text x="52" y="176" font-family="DejaVu Sans, Arial" font-size="13" fill="#263f59">Provisional conversational profiles  •  compatibility candidates  •  mutual introductions</text>
 <text x="52" y="198" font-family="DejaVu Sans, Arial" font-size="13" fill="#263f59">Optional translation / clarification  •  participant-directed mediation and exit</text>
 <path d="M480 217 V237" stroke="#697c91" stroke-width="2" stroke-dasharray="4 4"/>
 <rect x="35" y="240" width="890" height="78" rx="12" fill="#f5f0fa" stroke="#8d74a4" stroke-width="2"/>
 <text x="52" y="262" font-family="DejaVu Sans, Arial" font-size="16" font-weight="bold" fill="#573e77">2. Relational Assurance Plane</text>
 <text x="52" y="283" font-family="DejaVu Sans, Arial" font-size="13" fill="#49385d">Evaluate attribution, distortion, overmediation, authority transfer, and assistant behavior</text>
 <text x="52" y="303" font-family="DejaVu Sans, Arial" font-size="12" fill="#49385d">Evidence + uncertainty + response constraints; not diagnosis or autonomous relational control</text>
 <path d="M480 319 V338" stroke="#697c91" stroke-width="2" stroke-dasharray="4 4"/>
 <rect x="35" y="342" width="890" height="69" rx="12" fill="#eef6f0" stroke="#74a287" stroke-width="2"/>
 <text x="52" y="364" font-family="DejaVu Sans, Arial" font-size="16" font-weight="bold" fill="#2e6344">3. Governance and Data Plane</text>
 <text x="52" y="385" font-family="DejaVu Sans, Arial" font-size="13" fill="#2e6344">Consent  •  data minimization  •  derived-profile privacy  •  correction / deletion</text>
 <text x="52" y="403" font-family="DejaVu Sans, Arial" font-size="11" fill="#2e6344">No repurposing of relational signals for engagement or advertising optimization</text>
</svg>
